# Render.yaml for deploying the Modern Colours Supply Chain application

# This configuration sets up the necessary databases, Redis, and all microservices.
# The API Gateway is exposed as the main web service, while other services are private.
# Environment variables are used to connect services to each other and to the databases.
#
# Please make sure to create the following before deploying:
# 1. A PostgreSQL database on Render.
# 2. A Redis instance on Render.
# 3. A RabbitMQ instance from a cloud provider (e.g., CloudAMQP).
#
# You will need to create a secret group in Render called `mc-secrets` with the following keys:
# - DATABASE_URL (from your Render PostgreSQL)
# - REDIS_URL (from your Render Redis)
# - RABBITMQ_URL (from your cloud RabbitMQ provider)
# - JWT_SECRET (a secure, random string)
# - TELEGRAM_BOT_TOKEN
# - TELEGRAM_ADMIN_IDS
# - SMTP_HOST
# - SMTP_PORT
# - SMTP_USER
# - SMTP_PASS
# - ADMIN_EMAIL
# - AWS_REGION
# - AWS_S3_BUCKET

services:
  # ------------------ Databases & Caching ------------------
  - name: postgres
    type: pserv
    plan: free
    envVars:
      - key: POSTGRES_USER
        value: admin
      - key: POSTGRES_PASSWORD
        value: password
      - key: POSTGRES_DB
        value: supply_chain_db
    disk:
      name: postgres_data
      mountPath: /var/lib/postgresql/data
      sizeGB: 1

  - name: redis
    type: pserv
    plan: free

  # ------------------ Microservices ------------------

  - name: api-gateway
    type: web
    plan: free
    env: docker
    dockerfilePath: ./backend/api-gateway/Dockerfile
    dockerContext: ./backend/api-gateway
    envVars:
      - fromGroup: mc-secrets
      - key: PORT
        value: 3000
      - key: AUTH_SERVICE_URL
        value: http://auth-service:3001
      - key: INVENTORY_SERVICE_URL
        value: http://inventory-service:3002
      - key: ORDER_SERVICE_URL
        value: http://order-service:3003
      - key: DEALER_SERVICE_URL
        value: http://dealer-service:3004
      - key: ANALYTICS_SERVICE_URL
        value: http://analytics-service:8000
    healthCheckPath: /
    routes:
      - type: http
        path: /
        port: 3000

  - name: auth-service
    type: pserv
    plan: free
    env: docker
    dockerfilePath: ./backend/auth-service/Dockerfile
    dockerContext: ./backend/auth-service
    envVars:
      - fromGroup: mc-secrets
      - key: PORT
        value: 3001
      - key: DATABASE_URL
        fromService:
          type: pserv
          name: postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: pserv
          name: redis
          property: connectionString


  - name: inventory-service
    type: pserv
    plan: free
    env: docker
    dockerfilePath: ./backend/inventory-service/Dockerfile
    dockerContext: ./backend/inventory-service
    envVars:
      - fromGroup: mc-secrets
      - key: PORT
        value: 3002
      - key: DATABASE_URL
        fromService:
          type: pserv
          name: postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: pserv
          name: redis
          property: connectionString

  - name: order-service
    type: pserv
    plan: free
    env: docker
    dockerfilePath: ./backend/order-service/Dockerfile
    dockerContext: ./backend/order-service
    envVars:
      - fromGroup: mc-secrets
      - key: PORT
        value: 3003
      - key: DATABASE_URL
        fromService:
          type: pserv
          name: postgres
          property: connectionString

  - name: dealer-service
    type: pserv
    plan: free
    env: docker
    dockerfilePath: ./backend/dealer-service/Dockerfile
    dockerContext: ./backend/dealer-service
    envVars:
      - fromGroup: mc-secrets
      - key: PORT
        value: 3004
      - key: DATABASE_URL
        fromService:
          type: pserv
          name: postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: pserv
          name: redis
          property: connectionString

  - name: notification-service
    type: pserv
    plan: free
    env: docker
    dockerfilePath: ./backend/notification-service/Dockerfile
    dockerContext: ./backend/notification-service
    envVars:
      - fromGroup: mc-secrets
      - key: PORT
        value: 3005
      - key: DATABASE_URL
        fromService:
          type: pserv
          name: postgres
          property: connectionString
      - key: API_GATEWAY_URL
        fromService:
          type: web
          name: api-gateway
          property: url

  - name: analytics-service
    type: pserv
    plan: free
    env: docker
    dockerfilePath: ./backend/analytics-service/Dockerfile
    dockerContext: ./backend/analytics-service
    envVars:
      - fromGroup: mc-secrets
      - key: PORT
        value: 8000
      - key: DB_URI
        fromService:
          type: pserv
          name: postgres
          property: connectionString
      - key: PROJECT_NAME
        value: "Modern Colours Analytics"

  # ------------------ Frontend ------------------
  - name: frontend
    type: web
    plan: free
    env: node
    buildFilter:
      paths:
      - frontend/**
    buildCommand: "pnpm install && pnpm build"
    startCommand: "pnpm start"
    envVars:
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: api-gateway
          property: url
    routes:
      - type: http
        path: /
        port: 3000
