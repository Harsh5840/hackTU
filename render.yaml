# Render.yaml for deploying the Modern Colours Supply Chain application
# This configuration deploys all backend microservices to Render.
# Frontend is deployed to Vercel.
#
# Required secret group in Render: `mc-secrets`
# Keys needed:
# - JWT_SECRET
# - RABBITMQ_URL
# - TELEGRAM_BOT_TOKEN
# - TELEGRAM_ADMIN_IDS
# - SMTP_HOST, SMTP_PORT, SMTP_USER, SMTP_PASS
# - ADMIN_EMAIL
# - AWS_REGION, AWS_S3_BUCKET

databases:
  - name: postgres
    plan: free
    databaseName: supply_chain_db
    user: admin

services:

  # ------------------ Microservices ------------------

  - name: api-gateway
    type: web
    plan: free
    runtime: docker
    dockerfilePath: ./backend/api-gateway/Dockerfile
    dockerContext: ./backend/api-gateway
    envVars:
      - fromGroup: mc-secrets
      - key: PORT
        value: 3000
      - key: AUTH_SERVICE_URL
        value: http://auth-service:3001
      - key: INVENTORY_SERVICE_URL
        value: http://inventory-service:3002
      - key: ORDER_SERVICE_URL
        value: http://order-service:3003
      - key: DEALER_SERVICE_URL
        value: http://dealer-service:3004
      - key: ANALYTICS_SERVICE_URL
        value: http://analytics-service:8000
    healthCheckPath: /

  - name: auth-service
    type: pserv
    plan: free
    runtime: docker
    dockerfilePath: ./backend/auth-service/Dockerfile
    dockerContext: ./backend/auth-service
    envVars:
      - fromGroup: mc-secrets
      - key: PORT
        value: 3001
      - key: DATABASE_URL
        fromDatabase:
          name: postgres
          property: connectionString


  - name: inventory-service
    type: pserv
    plan: free
    runtime: docker
    dockerfilePath: ./backend/inventory-service/Dockerfile
    dockerContext: ./backend/inventory-service
    envVars:
      - fromGroup: mc-secrets
      - key: PORT
        value: 3002
      - key: DATABASE_URL
        fromDatabase:
          name: postgres
          property: connectionString

  - name: order-service
    type: pserv
    plan: free
    runtime: docker
    dockerfilePath: ./backend/order-service/Dockerfile
    dockerContext: ./backend/order-service
    envVars:
      - fromGroup: mc-secrets
      - key: PORT
        value: 3003
      - key: DATABASE_URL
        fromDatabase:
          name: postgres
          property: connectionString

  - name: dealer-service
    type: pserv
    plan: free
    runtime: docker
    dockerfilePath: ./backend/dealer-service/Dockerfile
    dockerContext: ./backend/dealer-service
    envVars:
      - fromGroup: mc-secrets
      - key: PORT
        value: 3004
      - key: DATABASE_URL
        fromDatabase:
          name: postgres
          property: connectionString

  - name: notification-service
    type: pserv
    plan: free
    runtime: docker
    dockerfilePath: ./backend/notification-service/Dockerfile
    dockerContext: ./backend/notification-service
    envVars:
      - fromGroup: mc-secrets
      - key: PORT
        value: 3005
      - key: DATABASE_URL
        fromDatabase:
          name: postgres
          property: connectionString
      - key: API_GATEWAY_URL
        value: https://api-gateway.onrender.com

  - name: analytics-service
    type: pserv
    plan: free
    runtime: docker
    dockerfilePath: ./backend/analytics-service/Dockerfile
    dockerContext: ./backend/analytics-service
    envVars:
      - fromGroup: mc-secrets
      - key: PORT
        value: 8000
      - key: DB_URI
        fromDatabase:
          name: postgres
          property: connectionString
      - key: PROJECT_NAME
        value: "Modern Colours Analytics"

