version: '3.8'

services:
  # --- Infrastructure ---
  postgres:
    image: postgres:15-alpine
    container_name: mc_postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: supply_chain_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data 
    networks:
      - mc_network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U admin -d supply_chain_db" ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: mc_redis
    ports:
      - "6379:6379"
    networks:
      - mc_network

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: mc_rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: password
    networks:
      - mc_network

  # --- Microservices ---

  api-gateway:
    build: ./backend/api-gateway
    container_name: mc_api_gateway
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - PORT=3000
      - AUTH_SERVICE_URL=http://auth-service:3001
      - INVENTORY_SERVICE_URL=http://inventory-service:3002
      - ORDER_SERVICE_URL=http://order-service:3003
      - DEALER_SERVICE_URL=http://dealer-service:3004
      - ANALYTICS_SERVICE_URL=http://analytics-service:8000
    depends_on:
      - auth-service
      - inventory-service
    networks:
      - mc_network

  auth-service:
    build: ./backend/auth-service
    container_name: mc_auth_service
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=development
      - PORT=3001
      - DATABASE_URL=postgresql://admin:password@postgres:5432/supply_chain_db?schema=auth
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=dev_secret
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - mc_network

  inventory-service:
    build: ./backend/inventory-service
    container_name: mc_inventory_service
    ports:
      - "3002:3002"
    environment:
      - NODE_ENV=development
      - PORT=3002
      - DATABASE_URL=postgresql://admin:password@postgres:5432/supply_chain_db?schema=inventory
      - REDIS_URL=redis://redis:6379
      - RABBITMQ_URL=amqp://admin:password@rabbitmq:5672
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_started
    networks:
      - mc_network

  order-service:
    build: ./backend/order-service
    container_name: mc_order_service
    ports:
      - "3003:3003"
    environment:
      - NODE_ENV=development
      - PORT=3003
      - DATABASE_URL=postgresql://admin:password@postgres:5432/supply_chain_db?schema=orders
      - RABBITMQ_URL=amqp://admin:password@rabbitmq:5672
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - mc_network

  dealer-service:
    build: ./backend/dealer-service
    container_name: mc_dealer_service
    ports:
      - "3004:3004"
    environment:
      - NODE_ENV=development
      - PORT=3004
      - DATABASE_URL=postgresql://admin:password@postgres:5432/supply_chain_db?schema=dealers
      - REDIS_URL=redis://redis:6379
      - RABBITMQ_URL=amqp://admin:password@rabbitmq:5672
      - AWS_REGION=ap-south-1
      - AWS_S3_BUCKET=mock-bucket
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - mc_network

  notification-service:
    build: ./backend/notification-service
    container_name: mc_notification_service
    ports:
      - "3005:3005"
    environment:
      - NODE_ENV=development
      - PORT=3005
      - RABBITMQ_URL=amqp://admin:password@rabbitmq:5672
      - DATABASE_URL=postgresql://admin:password@postgres:5432/supply_chain_db?schema=notifications
    depends_on:
      rabbitmq:
        condition: service_started
    networks:
      - mc_network

  analytics-service:
    build: ./backend/analytics-service
    container_name: mc_analytics_service
    ports:
      - "8000:8000"
    environment:
      - PROJECT_NAME=Modern Colours Analytics
      - DB_URI=postgresql://admin:password@postgres:5432/supply_chain_db
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - mc_network

networks:
  mc_network:
    driver: bridge

volumes:
  postgres_data:
